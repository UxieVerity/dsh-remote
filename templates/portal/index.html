<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="DSH remote access portal">
  <title>DSH Remote</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #0e1626;
      --panel-2: #121d31;
      --line: #22314d;
      --text: #edf3ff;
      --muted: #9fb0cc;
      --accent: #5eead4;
      --accent-2: #60a5fa;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(96, 165, 250, .18), transparent 60%),
        radial-gradient(700px 420px at 10% 0%, rgba(94, 234, 212, .12), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px calc(32px + env(safe-area-inset-bottom));
    }

    .shell { width: min(760px, 100%); }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06111f;
      font-weight: 800;
      letter-spacing: -.04em;
      box-shadow: 0 10px 30px rgba(96, 165, 250, .25);
    }

    .brand-name {
      font-size: 14px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 44px);
      letter-spacing: -.03em;
      line-height: 1.1;
    }

    .lede {
      margin: 0 0 26px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 620px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .pc {
      display: block;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .pc:hover, .pc:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(94, 234, 212, .55);
      background: linear-gradient(180deg, #16243d, var(--panel));
      outline: none;
    }

    .pc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .pc-id {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(94, 234, 212, .12);
    }

    .pc-name {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -.02em;
    }

    .pc-desc {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .pc-open {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .pc-open span {
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .custom {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(14, 22, 38, .65);
    }

    .custom label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    .row input:focus {
      outline: none;
      border-color: rgba(94, 234, 212, .55);
    }

    .row button {
      flex: 0 0 auto;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06111f;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .row button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      margin: 8px 0 0;
      color: #71829f;
      font-size: 12px;
      line-height: 1.5;
    }

    .note {
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      background: rgba(14, 22, 38, .65);
    }

    code {
      color: var(--text);
      background: rgba(96, 165, 250, .12);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: .92em;
    }

    footer {
      margin-top: 18px;
      color: #71829f;
      font-size: 12px;
      line-height: 1.6;
    }

    .warn {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid rgba(251, 113, 133, .45);
      border-radius: 12px;
      background: rgba(251, 113, 133, .08);
      color: #fecdd3;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="mark" aria-hidden="true">D</div>
      <div class="brand-name">DSH Remote</div>
    </div>

    <h1>选择一台电脑</h1>
    <p class="lede">
      通过 TLS 中转打开对应电脑上的 DSH Web。电脑只主动外连服务器，不需要公网 IP。
    </p>

    <section class="grid" id="pcs" aria-label="电脑列表">
      <div class="empty">正在读取电脑列表...</div>
    </section>

    <form class="custom" id="custom">
      <label for="pc-name">或直接输入电脑名（例如 pc-c）</label>
      <div class="row">
        <input id="pc-name" name="pc-name" autocomplete="off" spellcheck="false"
               pattern="[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?"
               placeholder="pc-c" aria-describedby="pc-hint">
        <button type="submit">打开</button>
      </div>
      <p class="hint" id="pc-hint">
        只填子域名前缀，不要带协议或点号。电脑必须先通过 add-pc.sh 注册，并配置好 frpc。
      </p>
    </form>

    <div class="warn" id="config-warning">
      门户域名占位符尚未替换。请重新运行服务器安装脚本。
    </div>

    <div class="note">
      第一次进入某台电脑时，需要设置该机的 DSH 管理员账号。门户登录密码和
      DSH 登录密码是两套，不要混用。手机浏览器菜单里选择“添加到主屏幕”即可安装为 PWA。
    </div>

    <footer>
      仅通过 HTTPS 访问。若页面无法打开，请先确认门户证书与 DNS。
    </footer>
  </main>

  <script>
    // Replaced at install time by scripts/server/install-nginx-site.sh.
    const BASE_DOMAIN = "__BASE_DOMAIN__";

    const grid = document.getElementById("pcs");
    const form = document.getElementById("custom");
    const input = document.getElementById("pc-name");
    const labelPattern = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;

    if (!BASE_DOMAIN || BASE_DOMAIN.includes("__")) {
      document.getElementById("config-warning").style.display = "block";
      input.disabled = true;
      form.querySelector("button").disabled = true;
    }

    function openPc(name) {
      window.location.assign(`https://${name}.${BASE_DOMAIN}/`);
    }

    function card(pc) {
      const link = document.createElement("a");
      link.className = "pc";
      link.href = `https://${pc.id}.${BASE_DOMAIN}/`;
      link.rel = "noopener";

      const top = document.createElement("div");
      top.className = "pc-top";

      const id = document.createElement("span");
      id.className = "pc-id";
      id.textContent = pc.id;

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.setAttribute("aria-hidden", "true");

      const name = document.createElement("h2");
      name.className = "pc-name";
      name.textContent = pc.name || pc.id;

      const desc = document.createElement("p");
      desc.className = "pc-desc";
      desc.textContent = pc.desc || "DSH Web";

      const open = document.createElement("span");
      open.className = "pc-open";
      open.textContent = "打开 DSH ↗";

      top.append(id, dot);
      link.append(top, name, desc, open);
      return link;
    }

    async function loadPcs() {
      let pcs = [];
      try {
        const response = await fetch("/pcs.json", { cache: "no-store" });
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data)) pcs = data;
        }
      } catch (_) {
        // Keep the custom-name form usable if the registry is unavailable.
      }

      grid.replaceChildren();
      const valid = pcs.filter((pc) => pc && labelPattern.test(pc.id || ""));
      if (!valid.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "还没有已注册的电脑。请先运行 add-pc.sh，或在下面直接输入电脑名。";
        grid.appendChild(empty);
        return;
      }
      for (const pc of valid) grid.appendChild(card(pc));
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim().toLowerCase();
      if (!labelPattern.test(name)) {
        input.setCustomValidity("请输入 1-63 位小写字母、数字或连字符，且不能以连字符开头/结尾。");
        input.reportValidity();
        return;
      }
      input.setCustomValidity("");
      openPc(name);
    });

    input.addEventListener("input", () => input.setCustomValidity(""));
    loadPcs();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
